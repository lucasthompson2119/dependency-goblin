# =============================================================================
# .gitlab-ci.yml
# Pipeline includes:
#   - Standard test / build / publish workflow
#   - Daily vulnerability scan (yarn.lock + gradle.lockfile)
#   - Auto-remediation: upgrade deps → lint → build → test → open MR
# =============================================================================
 
# -----------------------------------------------------------------------------
# REQUIRED CI/CD VARIABLES (Settings → CI/CD → Variables)
# -----------------------------------------------------------------------------
# GL_PAT              Personal Access Token (api + write_repository scopes) [masked]
# ASSIGNEE_USER_ID    GitLab numeric user ID to assign the auto-fix MR to
# -----------------------------------------------------------------------------
 
stages:
  # - test
  # - build
  # - publish
  # - scan
  - check
  - auto-fix
  - fix-lint
  - fix-build
  - fix-test
  - merge-request
 
