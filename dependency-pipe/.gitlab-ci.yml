# =============================================================================
# .gitlab-ci.yml — Vulnerability Auto-Remediation Template
#
# Intended usage — in each project's .gitlab-ci.yml:
#
#   include:
#     - project: 'your-group/centralized-pipelines'
#       file: '/standard-pipeline.yml'    # your existing test/build/publish jobs
#       ref: main
#     - project: 'your-group/vuln-remediation'
#       file: '/.gitlab-ci.yml'           # this file
#       ref: main
#
# Flow:
#   check:vulnerabilities  →  parse scan report, set FIX_* flags
#   auto:fix               →  upgrade affected deps + lint inline, push branch
#   trigger:validation     →  fire standard pipeline on fix branch (runs your
#                             existing test/build jobs — no duplication)
#   create:merge-request   →  open MR only if triggered pipeline passed
#
# REQUIRED CI/CD VARIABLES (Settings → CI/CD → Variables in each project)
#   GL_PAT             Personal Access Token (api + write_repository scopes) [masked]
#   ASSIGNEE_USER_ID   GitLab numeric user ID to assign the MR to
# =============================================================================
variables:
  DEPENDENCY_SAVIOR_TOKEN: "$DEPENDENCY_SAVIOR_TOKEN"
  FRONTEND_CIYAML_URL: $FRONTEND_CIYAML_URL
  FRONTEND_CIYAML_FILE: $FRONTEND_CIYAML_FILE

# stages:
#   - check
#   - fix-frontend
#   - fix-backend
#   - trigger-validation
#   - merge-request

# =============================================================================
# CHECK — parse scan report, identify which lockfiles are affected
#
# Produces dotenv flags:
#   VULNERABILITIES_FOUND   — true if any CVEs exist
#   FIX_FRONTEND            — true if frontend/yarn.lock is affected
#   FIX_JOURNEY             — true if journey/yarn.lock is affected
#   FIX_BACKEND             — true if gradle.lockfile is affected
# =============================================================================

check:vulnerabilities:
  stage: check
  rules:
  - if: '$CI_PIPELINE_SOURCE == "schedule"'
  - if: '$CI_PIPELINE_SOURCE == "web" && $RUN_DEP_PIPE == "true"'  # manual trigger override for testing and devs
  - when: never
  tags:
    - px-app-build
  image: 421584343086.dkr.ecr.us-gov-west-1.amazonaws.com/1-platform-images/chainguard/pipeline-image:latest
  needs:
    - project: "$CI_PROJECT_PATH"
      job: dependency-scanning
      ref: "main"
      artifacts: true
  script:
    - |
      python3 << 'EOF'
      import json, re, textwrap

      with open('gl-dependency-scanning-report.json') as f:
          report = json.load(f)

      target_severities = {'Critical', 'High', 'Medium', 'Low'}

      affected_files = set()
      vuln_summary = []
      gradle_remediations = []  # list of (package, from_version, to_version, file)

      for v in report.get('vulnerabilities', []):
          if v.get('severity') not in target_severities:
              continue

          loc       = v.get('location', {})
          loc_file  = loc.get('file', '')
          dep       = loc.get('dependency', {})
          pkg_name  = dep.get('package', {}).get('name', 'unknown')
          from_ver  = dep.get('version', '')
          solution  = v.get('solution', '')
          severity  = v.get('severity', '')

          affected_files.add(loc_file)
          vuln_summary.append(
              f"  [{severity}] {v.get('name')} — {loc_file} "
              f"(package: {pkg_name} @ {from_ver})"
          )

          # Extract target version from solution text
          # Handles: "Upgrade to version 4.1.133.Final or above."
          #           "Upgrade to versions 1.2.3 or above."
          #           "Upgrade to 1.2.3."
          match = re.search(
              r'[Uu]pgrade to (?:versions?\s+)?([^\s,]+)',
              solution
          )
          to_ver = match.group(1).rstrip('.,') if match else None

          if loc_file == 'build.gradle' and from_ver and to_ver:
              gradle_remediations.append((pkg_name, from_ver, to_ver, loc_file))
              print(f"  [GRADLE FIX] {pkg_name}: {from_ver} → {to_ver} in {loc_file}")
          elif loc_file == 'build.gradle' and not to_ver:
              print(f"  [GRADLE WARN] Could not parse target version from solution: '{solution}'")

      print(f"\nAffected lockfiles: {affected_files or 'none'}")
      print("Vulnerability summary:")
      for line in vuln_summary:
          print(line)

      fix_frontend_package = 'yarn.lock'          in affected_files
      fix_frontend         = 'frontend/yarn.lock' in affected_files
      fix_journey          = 'journey/yarn.lock'  in affected_files
      fix_backend          = 'build.gradle'       in affected_files
      any_found            = fix_frontend_package or fix_frontend or fix_journey or fix_backend

      with open('vuln.env', 'w') as env:
          env.write(f"VULNERABILITIES_FOUND={'true' if any_found           else 'false'}\n")
          env.write(f"FIX_FRONTEND_PACKAGE={'true'  if fix_frontend_package else 'false'}\n")
          env.write(f"FIX_FRONTEND={'true'          if fix_frontend         else 'false'}\n")
          env.write(f"FIX_JOURNEY={'true'           if fix_journey          else 'false'}\n")
          env.write(f"FIX_BACKEND={'true'           if fix_backend          else 'false'}\n")

      # Write a self-contained remediation script for fix-backend to execute.
      # Each line is a sed in-place substitution scoped to the exact package
      # and version so unrelated dependencies are never touched.
      with open('gradle_remediations.sh', 'w') as sh:
          sh.write("#!/bin/sh\nset -e\n\n")
          if gradle_remediations:
              for pkg_name, from_ver, to_ver, loc_file in gradle_remediations:
                  # Gradle uses : as group/artifact separator; the report uses /
                  artifact = pkg_name.split('/')[-1]
                  sh.write(f"echo \"  Patching {pkg_name}: {from_ver} -> {to_ver} in {loc_file}\"\n")
                  escaped_artifact = re.escape(artifact)

                  sh.write(textwrap.dedent(f"""\
                  python3 << 'PYEOF'
                  from pathlib import Path
                  import re
                  path = Path("{loc_file}")
                  text = path.read_text()
                  pattern = re.compile(
                    r"(implementation\\(['\\"](?:[^:'\\"]+:)?{escaped_artifact}['\\"]\\)\\s*\\{{[^}}]*?require\\s+['\\"])"
                    r"([^'\\"]+)"
                    r"(['\\"])",
                    re.DOTALL
                  )
                  updated = pattern.sub(
                    rf"\\g<1>{to_ver}\\3",
                    text
                  )
                  path.write_text(updated)
                  print("Updated {artifact} -> {to_ver}")
                  PYEOF
                  """))
                  sh.write(f"echo \"  Done.\"\n\n")
          else:
              sh.write("echo 'No gradle remediations to apply.'\n")

      print(f"\nWrote {len(gradle_remediations)} gradle remediation(s) to gradle_remediations.sh")

      if not any_found:
          print("\nNo vulnerabilities found. Pipeline will stop after this job.")
      else:
          print(
              f"\nFlags — FIX_FRONTEND_PACKAGE={fix_frontend_package}, "
              f"FIX_FRONTEND={fix_frontend}, FIX_JOURNEY={fix_journey}, "
              f"FIX_BACKEND={fix_backend}"
          )
      EOF
  artifacts:
    reports:
      dotenv: vuln.env
    paths:
      - gradle_remediations.sh   # ← consumed by fix-backend
    expire_in: 1 day
# =============================================================================
# AUTO-FIX — create branch, upgrade affected deps, lint inline, push
#
# Single job to avoid parallel git commit conflicts.
# Linting is run immediately after each upgrade so failures are caught
# before the branch is pushed.
# =============================================================================

.node:
  image: 421584343086.dkr.ecr.us-gov-west-1.amazonaws.com/1-platform-images/chainguard/node-fips:20.20-dev
  tags:
    - px-app-build
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
    policy: pull
  before_script:
    - |
      export COMBINED_CA="$CI_PROJECT_DIR/combined-ca.crt"
      cat /etc/ssl/certs/ca-certificates.crt /etc/ssl/custom/dod-ca-bundle.pem > "$COMBINED_CA"
      export NODE_EXTRA_CA_CERTS="$COMBINED_CA"
      npm config set cafile "$COMBINED_CA"
      yarn config set cafile "$COMBINED_CA"

fix-frontend:
  stage: fix-frontend
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $RUN_DEP_PIPE == "true"'  # manual trigger override for testing and devs
    - when: never
  extends: .node
  needs:
    - job: check:vulnerabilities
      artifacts: true
  script:
    - |
      if [ "$FIX_FRONTEND_PACKAGE" != "true" ] && [ "$FIX_FRONTEND" != "true" ] && [ "$FIX_JOURNEY" != "true" ]; then
        echo "No frontend vulnerabilities found. Skipping."
        exit 0
      fi

      echo "Running auto-fix..."

    - git config --global user.email "sdu4-2@swf.army.mil"
    - git config --global user.name "Dependency_Savior"
    - git remote set-url origin "https://oauth2:$DEPENDENCY_SAVIOR_TOKEN@$CI_SERVER_HOST/$CI_PROJECT_PATH.git"
    - git fetch origin
    - git checkout -b "auto-fix/vuln-remediation-$CI_PIPELINE_ID" "origin/$CI_DEFAULT_BRANCH"

    # --- yarn.lock ---
    - |
      if [ "$FIX_FRONTEND_PACKAGE" = "true" ]; then
        echo "=== Upgrading + linting frontend ==="
        yarn upgrade 
        yarn lint 
        # git add yarn.lock package.json
        # git diff --cached --quiet || git commit -m "fix(frontend_package): auto-upgrade yarn dependencies [skip ci]"
      else
        echo "--- Skipping frontend (no CVEs in yarn.lock) ---"
      fi

    # --- frontend/yarn.lock ---
    - |
      if [ "$FIX_FRONTEND" = "true" ]; then
        echo "=== Upgrading + linting frontend ==="
        cd frontend
        yarn upgrade 
        yarn lint 
        cd ..
        # git add frontend/yarn.lock frontend/package.json
        # git diff --cached --quiet || git commit -m "fix(frontend): auto-upgrade yarn dependencies [skip ci]"
      else
        echo "--- Skipping frontend (no CVEs in frontend/yarn.lock) ---"
      fi

    # --- journey/yarn.lock ---
    - |
      if [ "$FIX_JOURNEY" = "true" ]; then
        echo "=== Upgrading + linting journey ==="
        cd journey
        yarn upgrade 
        yarn lint 
        cd ..
        # git add journey/yarn.lock journey/package.json
        # git diff --cached --quiet || git commit -m "fix(journey): auto-upgrade yarn dependencies [skip ci]"
      else
        echo "--- Skipping journey (no CVEs in journey/yarn.lock) ---"
      fi
    
    - git push origin "auto-fix/vuln-remediation-$CI_PIPELINE_ID"
    - echo "FIX_BRANCH=auto-fix/vuln-remediation-$CI_PIPELINE_ID" >> fix_branch.env

  artifacts:
    reports:
      dotenv: fix_branch.env
    expire_in: 1 day

.gradle:
  image: $CI_BASE_IMAGE_JDK_17
  variables:
    ALLOW_EMPTY_PASSWORD: "yes"
    KEYSTORE: /usr/lib/jvm/default-jvm/lib/security/cacerts
    KEYSTORE_PASS: changeit
  tags:
    - px-app-build
  before_script:
    - |- 
      if [ "$FIX_BACKEND" != "true" ]; then
        echo "No backend vulnerabilities found. Skipping."
        exit 0
      fi

      cp /usr/lib/jvm/default-jvm/lib/security/cacerts /tmp/cacerts && \
      chmod +w /tmp/cacerts && \
      mkdir -p /tmp/split-certs && \
      awk 'BEGIN {c=0} /-----BEGIN CERTIFICATE-----/ {c++; close(f); f="/tmp/split-certs/cert."c} f {print > f}' /etc/ssl/custom/dod-ca-bundle.pem && \
      for cert_file in /tmp/split-certs/*; do \
        keytool -importcert -trustcacerts -noprompt \
            -alias "$(basename $cert_file)" \
            -file "$cert_file" \
            -keystore /tmp/cacerts \
            -storepass changeit; \
      done && \
      rm -rf /tmp/split-certs
    - export JAVA_TOOL_OPTIONS="-Djavax.net.ssl.trustStoreType=JKS -DsystemProp.javax.net.ssl.trustStore=/tmp/cacerts -Djavax.net.ssl.trustStore=/tmp/cacerts --module-path=/usr/share/java/bouncycastle-fips"
    - mkdir -p .gradle
    - export GRADLE_USER_HOME=`pwd`/.gradle 
    - sed -i 's#https\\://services.gradle.org/distributions/#http://app-cicd-static-files.srcerer:8080/#g' gradle/wrapper/gradle-wrapper.properties
fix-backend-python:
  stage: fix-backend
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $RUN_DEP_PIPE == "true"'  # manual trigger override for testing and devs
    - when: never
  tags:
    - px-app-build
  image: 421584343086.dkr.ecr.us-gov-west-1.amazonaws.com/1-platform-images/chainguard/pipeline-image:latest
  needs:
    - job: check:vulnerabilities
      artifacts: true
  script:
    - |
      if [ "$FIX_BACKEND" != "true" ]; then
        echo "No backend vulnerabilities found. Skipping."
        exit 0
      fi

      echo "=== Applying gradle remediations ==="
      cat gradle_remediations.sh
      chmod +x gradle_remediations.sh
      ./gradle_remediations.sh

      echo "=== Committing Changes ==="

      git config --global --add safe.directory /builds/$CI_PROJECT_PATH
      git config --global user.email "sdu4-2@swf.army.mil"
      git config --global user.name "Dependency_Savior"
      git remote set-url origin "https://oauth2:$DEPENDENCY_SAVIOR_TOKEN@$CI_SERVER_HOST/$CI_PROJECT_PATH.git"
      git fetch origin
      git checkout -b "auto-fix/vuln-remediation-$CI_PIPELINE_ID" "origin/$CI_DEFAULT_BRANCH" || git checkout "auto-fix/vuln-remediation-$CI_PIPELINE_ID"
      git add build.gradle
      git diff --cached --quiet || git commit -m "fix(backend): auto-patch dependency versions for CVE remediation [skip ci]"
      git push origin "auto-fix/vuln-remediation-$CI_PIPELINE_ID"
      echo "FIX_BRANCH=auto-fix/vuln-remediation-$CI_PIPELINE_ID" >> fix_branch.env
  artifacts:
    reports:
      dotenv: fix_branch.env
    expire_in: 1 day

fix-backend-gradle:
  stage: fix-backend
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $RUN_DEP_PIPE == "true"'  # manual trigger override for testing and devs
    - when: never
  extends: .gradle
  needs:
    - job: fix-backend-python
    - job: check:vulnerabilities
      artifacts: true
  script:
    - |

      git config --global user.email "sdu4-2@swf.army.mil"
      git config --global user.name "Dependency_Savior"
      git remote set-url origin "https://oauth2:$DEPENDENCY_SAVIOR_TOKEN@$CI_SERVER_HOST/$CI_PROJECT_PATH.git"
      git fetch origin
      git checkout "auto-fix/vuln-remediation-$CI_PIPELINE_ID"

      echo "=== Verifying build still compiles after patches ==="
      rm gradle.lockfile
      # ./gradlew --refresh-dependencies dependencies
      ./gradlew dependencies --write-locks

      git add gradle.lockfile
      git commit -m "fix(backend): auto-patch dependency versions for CVE remediation [skip ci]"
      git push origin "auto-fix/vuln-remediation-$CI_PIPELINE_ID"
      echo "FIX_BRANCH=auto-fix/vuln-remediation-$CI_PIPELINE_ID" >> fix_branch.env
  artifacts:
    reports:
      dotenv: fix_branch.env
    expire_in: 1 day

