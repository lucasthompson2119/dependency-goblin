# =============================================================================
# Vulnerability Auto-Remediation Pipeline
#
# This file lives in its own repo and is pulled into consuming projects via
# include:. It should never be the only include — it expects test/build/publish
# jobs to exist from a separate centralized pipeline include.
#
# Consuming project .gitlab-ci.yml example:
#    spec:
#      inputs:
#        choice:
#          type: string
#          options:
#            - "None"
#            - "RUN_DEPENDENCY_GOBLIN"
#          default: "None"
#
#   stages:
#     - check
#     - fix-frontend
#     - fix-backend
#     - merge-request
#     - test
#     - build
#     - publish
#
#   include:
#     - project: "$FRONTEND_CIYAML_URL"
#       file: "$FRONTEND_CIYAML_FILE"
#       ref: "main"
#
#     - project: "$DEPENDENCY_PIPE_CIYAML_URL"
#       file: "$DEPENDENCY_PIPE_CIYAML_FILE"
#       ref: "main"
#
# Pipeline flow (schedule / manual web trigger only):
#   check:vulnerabilities   parse the latest dependency scan report, identify
#                           which lockfiles are affected, write FIX_* flags and
#                           a gradle remediation shell script as artifacts
#   fix-frontend            upgrade affected yarn.lock files, commit to fix branch
#   fix-backend-python      apply version patches to build.gradle via Python,
#                           commit to fix branch
#   fix-backend-gradle      regenerate gradle.lockfile against patched build.gradle,
#                           commit to fix branch
#   create:merge-request    open an MR from the fix branch to default branch
#
# Required CI/CD variables (Settings → CI/CD → Variables in each project):
#   DEPENDENCY_GOBLIN_TOKEN             PAT with api + write_repository scopes [masked]
#   DEPENDENCY_GOBLIN_NAME              Commit author/committer display name
#   DEPENDENCY_GOBLIN_EMAIL             Commit author/committer email
#   DEPENDENCY_GOBLIN_GPG_PRIVATE_KEY   ASCII-armored private key, File-type variable
#                                        (passed straight to `gpg --import` as a path,
#                                        matching deploy.sh's CLUSTERVERSE_GPG_PRIVATE_KEY)
#   DEPENDENCY_GOBLIN_GPG_FINGERPRINT   Full fingerprint of the above key [masked]
#   DEPENDENCY_GOBLIN_GPG_PASSPHRASE    Passphrase for the above key [masked]
# =============================================================================

variables:
  # Re-declare so these are available in all jobs without referencing the
  # secret name directly in every script block. DEPENDENCY_GOBLIN_GPG_PRIVATE_KEY
  # is deliberately NOT re-declared here — it's a File-type CI/CD variable,
  # and self-referencing a File-type variable this way ("NAME: $NAME")
  # doesn't expand to the file's path the way it does for a normal masked
  # variable like DEPENDENCY_GOBLIN_TOKEN. GitLab silently passes through
  # the literal, un-expanded string "$DEPENDENCY_GOBLIN_GPG_PRIVATE_KEY"
  # instead, which is exactly what broke import for a while — the value
  # gpg was choking on was that 34-character literal string, not the key.
  # .configure-commit-signing references DEPENDENCY_GOBLIN_GPG_PRIVATE_KEY
  # directly (unshadowed), which resolves correctly.
  DEPENDENCY_GOBLIN_TOKEN: "$DEPENDENCY_GOBLIN_TOKEN"
  DEPENDENCY_GOBLIN_EMAIL: "$DEPENDENCY_GOBLIN_EMAIL"
  DEPENDENCY_GOBLIN_GPG_FINGERPRINT: "$DEPENDENCY_GOBLIN_GPG_FINGERPRINT"
  DEPENDENCY_GOBLIN_GPG_PASSPHRASE: "$DEPENDENCY_GOBLIN_GPG_PASSPHRASE"
  DEPENDENCY_GOBLIN_NAME: "$DEPENDENCY_GOBLIN_NAME"
  DEPENDENCY_GOBLIN_USERNAME: "$DEPENDENCY_GOBLIN_USERNAME"

# =============================================================================
# Shared rules template
#
# All dep-pipe jobs extend this so they only activate on:
#   - Scheduled pipeline runs (the daily CVE scan)
#   - Manual web triggers where RUN_DEPENDENCY_GOBLIN=true (for developer testing)
#   - Triggered child pipelines where RUN_DEPENDENCY_GOBLIN=true (future use)
#
# Any other pipeline source (push, merge_request_event, etc.) hits when:never,
# leaving those pipelines free to run only the test/build jobs from the other
# centralized include without interference from this file.
# =============================================================================

.dep_pipe_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $RUN_DEPENDENCY_GOBLIN == "true"'
    - if: '$CI_PIPELINE_SOURCE == "pipeline" && $RUN_DEPENDENCY_GOBLIN == "true"'
    - when: never

# =============================================================================
# Node base template
#
# Shared image, runner tag, cache config, and CA certificate setup for all
# jobs that invoke yarn. The combined CA file is required because the runner
# environment uses custom DoD CA bundles that Node/npm/yarn don't trust by
# default.
# =============================================================================

.node-dep:
  image: 421584343086.dkr.ecr.us-gov-west-1.amazonaws.com/1-platform-images/chainguard/node-fips-gpg:24.19.0-dev
  tags:
    - px-app-build
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
    policy: pull
  before_script:
    - |
      export COMBINED_CA="$CI_PROJECT_DIR/combined-ca.crt"
      cat /etc/ssl/certs/ca-certificates.crt /etc/ssl/custom/dod-ca-bundle.pem > "$COMBINED_CA"
      export NODE_EXTRA_CA_CERTS="$COMBINED_CA"
      npm config set cafile "$COMBINED_CA"
      yarn config set cafile "$COMBINED_CA"

# =============================================================================
# Gradle base template
#
# -----------------------------------------------------------------------------
# THIS IS DIFFERENT THAN THE .gradle USED ELSEWHERE!  The beginning of the
# before_script includes logic for checking the $FIX_BACKEND env that will
# break other jobs if used, thus this is called ".gradle-dep" whereas the
# image used for the test and build for backend is ".gradle"
# -----------------------------------------------------------------------------
#
# Shared image, runner tag, and JVM setup for all jobs that invoke gradlew.
# The before_script does three things:
#   1. Splits the DoD CA bundle into individual certs and imports each into
#      the JVM truststore so Gradle can reach internal artifact registries.
#   2. Sets JAVA_TOOL_OPTIONS to point the JVM at the updated truststore.
#   3. Redirects the Gradle wrapper download URL to the internal mirror so
#      the runner doesn't need external internet access.
# =============================================================================

.gradle-dep:
  image: $CI_BASE_IMAGE_JDK_21
  variables:
    ALLOW_EMPTY_PASSWORD: "yes"
    KEYSTORE: /usr/lib/jvm/default-jvm/lib/security/cacerts
    KEYSTORE_PASS: changeit
  tags:
    - px-app-build
  before_script:
    - |-
      if [ "$FIX_BACKEND" != "true" ]; then
        echo "No backend vulnerabilities found. Skipping."
        exit 0
      fi

      cp /usr/lib/jvm/default-jvm/lib/security/cacerts /tmp/cacerts && \
      chmod +w /tmp/cacerts && \
      mkdir -p /tmp/split-certs && \
      awk 'BEGIN {c=0} /-----BEGIN CERTIFICATE-----/ {c++; close(f); f="/tmp/split-certs/cert."c} f {print > f}' /etc/ssl/custom/dod-ca-bundle.pem && \
      for cert_file in /tmp/split-certs/*; do \
        keytool -importcert -trustcacerts -noprompt \
            -alias "$(basename $cert_file)" \
            -file "$cert_file" \
            -keystore /tmp/cacerts \
            -storepass changeit; \
      done && \
      rm -rf /tmp/split-certs
    - export JAVA_TOOL_OPTIONS="-Djavax.net.ssl.trustStoreType=JKS -DsystemProp.javax.net.ssl.trustStore=/tmp/cacerts -Djavax.net.ssl.trustStore=/tmp/cacerts --module-path=/usr/share/java/bouncycastle-fips"
    - mkdir -p .gradle
    - export GRADLE_USER_HOME=`pwd`/.gradle
    - sed -i 's#https\://services.gradle.org/distributions/#http://app-cicd-static-files.srcerer:8080/#g' gradle/wrapper/gradle-wrapper.properties

# =============================================================================
# Commit-signing fragment
#
# The new GitLab instance requires signed commits, so every job that commits
# on Dependency Goblin's behalf needs this run before it commits. It's kept
# as its own hidden template — NOT folded into .node-dep / .gradle-dep, and NOT
# added as a second entry in a job's extends: list — because extends:
# replaces before_script wholesale rather than merging it. A job that
# extends both .node-dep (CA-cert setup) and this fragment would keep only
# whichever came last in extends:, silently losing the other.
#
# Instead, jobs that need both splice them together explicitly with
# !reference, e.g.:
#
#   before_script:
#     - !reference [.node-dep, before_script]
#     - !reference [.configure-commit-signing, before_script]
#
# This mirrors deploy.sh's configureGpgSigning(): import the key into a
# scratch keyring, verify the imported fingerprint actually matches the
# configured one (so a stale/wrong key fails loudly instead of silently
# signing with something unexpected), then configure git to sign with it.
# GNUPGHOME is a fresh mktemp -d rather than the default ~/.gnupg since
# these chainguard-based images may not have a writable/prepared $HOME,
# and each job already runs in its own throwaway container regardless.
# =============================================================================

.configure-commit-signing:
  before_script:
    - |
      hash gpg || { echo "ERROR: GnuPG must be available on this runner image to sign commits"; exit 1; }

      export GNUPGHOME="$(mktemp -d)"
      chmod 700 "$GNUPGHOME"

      # This image has gpg-agent but no pinentry-* binary, and gpg-agent
      # needs *some* pinentry to ask for a passphrase whenever it touches
      # secret key material (import, sign, etc.). Loopback mode tells the
      # agent to take the passphrase directly from the calling process
      # instead of prompting an interactive pinentry, so no pinentry
      # package is needed at all.
      echo "allow-loopback-pinentry" > "$GNUPGHOME/gpg-agent.conf"
      echo "pinentry-mode loopback" > "$GNUPGHOME/gpg.conf"
      gpgconf --reload gpg-agent 2>/dev/null || true

      # DEPENDENCY_GOBLIN_GPG_PRIVATE_KEY may be configured as either a
      # GitLab "File" type variable (value is a path to the key on disk,
      # like deploy.sh's CLUSTERVERSE_GPG_PRIVATE_KEY) or a plain
      # "Variable" type holding the armored key text directly. Handle both
      # so a CI/CD variable-type mismatch doesn't silently break signing.
      #
      # GitLab Runner's generated job scripts run with set -e, and a bare
      # VAR="$(cmd)" assignment DOES trip errexit if cmd fails — the
      # script would die right here, before any of our own diagnostics
      # below get a chance to print. Wrapping the assignment as an if
      # condition is one of the standard exemptions from errexit, so we
      # capture gpg's real exit status and output instead of losing them.
      if [ -f "$DEPENDENCY_GOBLIN_GPG_PRIVATE_KEY" ]; then
        echo "DEPENDENCY_GOBLIN_GPG_PRIVATE_KEY resolved as a file path (File-type variable)"
        # Structural sanity check only — this never prints the key body,
        # just its size and whether the armor header/footer lines are
        # exactly what gpg expects. Those two lines are the public armor
        # delimiters, not secret material, so they're safe to print.
        echo "Private key file: $(wc -c < "$DEPENDENCY_GOBLIN_GPG_PRIVATE_KEY") bytes, $(wc -l < "$DEPENDENCY_GOBLIN_GPG_PRIVATE_KEY") lines"
        KEY_FIRST_LINE="$(head -n1 "$DEPENDENCY_GOBLIN_GPG_PRIVATE_KEY")"
        KEY_LAST_LINE="$(tail -n1 "$DEPENDENCY_GOBLIN_GPG_PRIVATE_KEY")"
        if [ "$KEY_FIRST_LINE" = "-----BEGIN PGP PRIVATE KEY BLOCK-----" ]; then
          echo "Armor header: OK"
        else
          echo "Armor header: MISMATCH (expected '-----BEGIN PGP PRIVATE KEY BLOCK-----')"
        fi
        if [ "$KEY_LAST_LINE" = "-----END PGP PRIVATE KEY BLOCK-----" ]; then
          echo "Armor footer: OK"
        else
          echo "Armor footer: MISMATCH (expected '-----END PGP PRIVATE KEY BLOCK-----')"
        fi
        if grep -q "$(printf '\r')" "$DEPENDENCY_GOBLIN_GPG_PRIVATE_KEY" 2>/dev/null; then
          echo "WARNING: file contains CRLF (Windows-style) line endings"
        fi

        if GPG_IMPORT_OUTPUT="$(gpg --batch --pinentry-mode loopback --passphrase "$DEPENDENCY_GOBLIN_GPG_PASSPHRASE" --import "$DEPENDENCY_GOBLIN_GPG_PRIVATE_KEY" 2>&1)"; then
          GPG_IMPORT_STATUS=0
        else
          GPG_IMPORT_STATUS=$?
        fi
      else
        echo "DEPENDENCY_GOBLIN_GPG_PRIVATE_KEY did NOT resolve as a file path — treating its value as the literal key text (plain Variable-type)"
        # Same structural sanity check as the file-path branch above,
        # applied to the variable's value directly instead of a file.
        KEY_BYTES="$(printf '%s' "$DEPENDENCY_GOBLIN_GPG_PRIVATE_KEY" | wc -c)"
        KEY_LINES="$(printf '%s\n' "$DEPENDENCY_GOBLIN_GPG_PRIVATE_KEY" | wc -l)"
        echo "Private key value: $KEY_BYTES bytes, $KEY_LINES lines"
        KEY_FIRST_LINE="$(printf '%s\n' "$DEPENDENCY_GOBLIN_GPG_PRIVATE_KEY" | head -n1)"
        KEY_LAST_LINE="$(printf '%s\n' "$DEPENDENCY_GOBLIN_GPG_PRIVATE_KEY" | tail -n1)"
        if [ "$KEY_FIRST_LINE" = "-----BEGIN PGP PRIVATE KEY BLOCK-----" ]; then
          echo "Armor header: OK"
        else
          echo "Armor header: MISMATCH (expected '-----BEGIN PGP PRIVATE KEY BLOCK-----')"
        fi
        if [ "$KEY_LAST_LINE" = "-----END PGP PRIVATE KEY BLOCK-----" ]; then
          echo "Armor footer: OK"
        else
          echo "Armor footer: MISMATCH (expected '-----END PGP PRIVATE KEY BLOCK-----')"
        fi

        if GPG_IMPORT_OUTPUT="$(printf '%s\n' "$DEPENDENCY_GOBLIN_GPG_PRIVATE_KEY" | gpg --batch --pinentry-mode loopback --passphrase "$DEPENDENCY_GOBLIN_GPG_PASSPHRASE" --import 2>&1)"; then
          GPG_IMPORT_STATUS=0
        else
          GPG_IMPORT_STATUS=$?
        fi
      fi
      echo "$GPG_IMPORT_OUTPUT"

      if [ "$GPG_IMPORT_STATUS" -ne 0 ]; then
        echo "ERROR: failed to import the Dependency Goblin GPG private key (gpg exit status $GPG_IMPORT_STATUS)"
        exit 1
      fi

      # Rather than looking the key up BY the configured fingerprint
      # (gpg --fingerprint <arg>, which fails hard with a bare "No public
      # key" if it doesn't match anything — no indication of what's
      # actually in the keyring), list every fingerprint gpg actually
      # imported and compare against what's configured. Fingerprints
      # aren't secret (they're the public identifier for the keypair),
      # so both are safe to print directly for a side-by-side diff.
      if GPG_LIST_OUTPUT="$(gpg --batch --with-colons --list-secret-keys 2>&1)"; then
        GPG_LIST_STATUS=0
      else
        GPG_LIST_STATUS=$?
      fi

      if [ "$GPG_LIST_STATUS" -ne 0 ]; then
        echo "$GPG_LIST_OUTPUT"
        echo "ERROR: could not list imported secret keys (gpg exit status $GPG_LIST_STATUS)"
        exit 1
      fi

      IMPORTED_FINGERPRINTS="$(printf '%s\n' "$GPG_LIST_OUTPUT" | awk -F: '$1 == "fpr" { print $10 }')"

      echo "Fingerprint(s) found in imported keyring:"
      echo "$IMPORTED_FINGERPRINTS"
      echo "Configured DEPENDENCY_GOBLIN_GPG_FINGERPRINT: $DEPENDENCY_GOBLIN_GPG_FINGERPRINT"

      if [ -z "$IMPORTED_FINGERPRINTS" ]; then
        echo "ERROR: no fingerprints found after import — the key may not have imported correctly"
        exit 1
      fi

      FINGERPRINT_MATCHED=0
      for fp in $IMPORTED_FINGERPRINTS; do
        if [ "$fp" = "$DEPENDENCY_GOBLIN_GPG_FINGERPRINT" ]; then
          FINGERPRINT_MATCHED=1
        fi
      done

      if [ "$FINGERPRINT_MATCHED" -ne 1 ]; then
        echo "ERROR: DEPENDENCY_GOBLIN_GPG_FINGERPRINT does not match any fingerprint in the imported key — update the CI/CD variable to one of the fingerprint(s) printed above"
        exit 1
      fi

      # git commit -S invokes gpg internally without a --passphrase flag.
      # gpg.conf's pinentry-mode loopback covers that call, but loopback
      # mode still needs a passphrase source on a cache miss, and git
      # won't supply one. Priming here — one explicit loopback unlock —
      # populates gpg-agent's cache for this key, so git's later call
      # gets served from cache instead of needing a passphrase itself.
      # Same set -e concern as the import above, same if/else fix.
      if GPG_PRIME_OUTPUT="$(
        echo "test" | gpg --batch --yes --pinentry-mode loopback --passphrase "$DEPENDENCY_GOBLIN_GPG_PASSPHRASE" \
          -u "$DEPENDENCY_GOBLIN_GPG_FINGERPRINT" --clearsign 2>&1 >/dev/null
      )"; then
        GPG_PRIME_STATUS=0
      else
        GPG_PRIME_STATUS=$?
      fi

      if [ "$GPG_PRIME_STATUS" -ne 0 ]; then
        echo "$GPG_PRIME_OUTPUT"
        echo "ERROR: could not unlock the Dependency Goblin GPG key non-interactively (gpg exit status $GPG_PRIME_STATUS) — check DEPENDENCY_GOBLIN_GPG_PASSPHRASE"
        exit 1
      fi

      git config --global user.name "$DEPENDENCY_GOBLIN_NAME"
      git config --global user.email "$DEPENDENCY_GOBLIN_EMAIL"
      git config --global user.signingkey "$DEPENDENCY_GOBLIN_GPG_FINGERPRINT"
      git config --global gpg.format openpgp
      git config --global gpg.program "$(command -v gpg)"
      git config --global commit.gpgsign true

      echo "Configured OpenPGP commit signing with fingerprint $DEPENDENCY_GOBLIN_GPG_FINGERPRINT"

# =============================================================================
# STAGE: check
# =============================================================================

check:vulnerabilities:
  stage: check
  extends: .dep_pipe_rules
  tags:
    - px-app-build
  image: 421584343086.dkr.ecr.us-gov-west-1.amazonaws.com/1-platform-images/chainguard/cdso-pipeline-image-two:latest
  # Pull the scan report artifact from the most recent dependency-scanning job
  # on main. This job does not run the scan itself — it consumes the report
  # produced by GitLab's built-in dependency scanning job which runs separately
  # on a schedule in each project.
  needs:
    - project: "$CI_PROJECT_PATH"
      job: dependency-scanning
      ref: "main"
      artifacts: true
  script:
    - |
      python3 << 'EOF'
      import json, re, textwrap

      # -------------------------------------------------------------------------
      # Load the scan report
      #
      # gl-dependency-scanning-report.json is pulled from the dependency-scanning
      # job artifact declared in needs: above. It is the standard GitLab
      # dependency scanning output and contains a top-level "vulnerabilities"
      # array where each entry describes one CVE found in one dependency.
      # -------------------------------------------------------------------------
      with open('gl-dependency-scanning-report.json') as f:
          report = json.load(f)

      # -------------------------------------------------------------------------
      # Severity filter
      #
      # Only process vulnerabilities at these severity levels. "Unknown" and
      # "Info" are intentionally excluded — they are either unscored advisories
      # or informational notices that don't represent an exploitable risk.
      # Change this set to tighten or loosen the filter (e.g. remove 'Low' to
      # reduce noise in projects with many transitive low-severity findings).
      # -------------------------------------------------------------------------
      target_severities = {'Critical', 'High', 'Medium', 'Low'}

      # -------------------------------------------------------------------------
      # Accumulators
      #
      # affected_files    — set of unique lockfile paths that have at least one
      #                     qualifying CVE. Used at the end to set FIX_* flags.
      #                     A set is used so duplicates are automatically dropped
      #                     when the same file contains multiple CVEs.
      #
      # vuln_summary      — list of human-readable strings printed to the job log
      #                     so the pipeline output shows a full CVE inventory.
      #
      # gradle_remediations — list of (pkg_name, from_ver, to_ver, file) tuples
      #                     for every build.gradle vulnerability where a target
      #                     version could be parsed. Fed into the shell script
      #                     generator at the end of this script.
      # -------------------------------------------------------------------------
      affected_files = set()
      vuln_summary = []
      gradle_remediations = []

      # -------------------------------------------------------------------------
      # Version comparison helper
      #
      # Converts a version string into a tuple of integers for reliable
      # comparison. Non-numeric suffixes like ".Final" or ".RELEASE" are stripped
      # because re.findall only pulls digit sequences, so "4.1.133.Final" and
      # "4.1.133" both produce (4, 1, 133) and compare as equal. This is
      # intentional — the suffix carries no ordering information relevant to
      # deciding whether an upgrade is needed.
      # -------------------------------------------------------------------------
      def version_key(v):
          return tuple(int(x) for x in re.findall(r'\d+', v))

      # -------------------------------------------------------------------------
      # Main vulnerability loop
      #
      # Iterates every entry in the report's "vulnerabilities" array. Each entry
      # is a dict with keys like id, name, severity, solution, location, etc.
      # Entries that don't meet the severity filter are skipped immediately so
      # none of the extraction logic runs on them.
      # -------------------------------------------------------------------------
      for v in report.get('vulnerabilities', []):
          if v.get('severity') not in target_severities:
              continue

          # ---------------------------------------------------------------------
          # Location and dependency extraction
          #
          # "location" tells us which file the vulnerable dependency was found in
          # (e.g. "frontend/yarn.lock" or "build.gradle"). This is the key field
          # that determines which fix job needs to run.
          #
          # "dependency" contains the package name and the currently installed
          # version. Both are needed to generate a precise regex substitution
          # that targets only this specific package.
          # ---------------------------------------------------------------------
          loc      = v.get('location', {})
          loc_file = loc.get('file', '')
          dep      = loc.get('dependency', {})

          # The "package" field has changed shape across GitLab analyzer versions.
          # Older versions return a plain string; newer versions return a dict
          # with a "name" key. Both are handled here so the pipeline works across
          # GitLab version upgrades without modification.
          pkg = dep.get('package', {})
          if isinstance(pkg, dict):
              pkg_name = pkg.get('name', 'unknown')
          else:
              pkg_name = str(pkg or 'unknown')

          from_ver = dep.get('version', '')
          solution = v.get('solution', '')
          severity = v.get('severity', '')

          # Add this file to the affected set and append a summary line for the
          # job log. The set deduplicates automatically, so if 10 CVEs all point
          # to frontend/yarn.lock, it only appears once in affected_files.
          affected_files.add(loc_file)
          vuln_summary.append(
              f"  [{severity}] {v.get('name')} — {loc_file} "
              f"(package: {pkg_name} @ {from_ver})"
          )

          # ---------------------------------------------------------------------
          # Target version extraction
          #
          # The solution field is free-text written by the advisory author and
          # may list a single version or one version per maintained release branch:
          #
          #   "Upgrade to version 4.1.133.Final or above."
          #   "Upgrade to versions 6.4.2, 7.3.2, 8.0.5 or above."
          #   "Upgrade to 1.2.3."
          #
          # Strategy:
          #   1. Extract the full candidate string after "Upgrade to [version(s)]"
          #   2. Split on whitespace and commas to get individual version tokens
          #   3. Discard any candidate that is not strictly greater than the
          #      currently installed version — these are fixes for release lines
          #      older than what is installed and would be a downgrade
          #   4. From the remaining candidates, select the minimum — the smallest
          #      version that still resolves the CVE, keeping the upgrade as
          #      conservative as possible
          #
          # Example: installed = 7.1.0, candidates = [6.4.2, 7.3.2, 8.0.5]
          #   6.4.2 is discarded (less than 7.1.0)
          #   remaining = [7.3.2, 8.0.5]
          #   selected  = 7.3.2  (minimum of remaining — stays in the 7.x line)
          #
          # If the regex finds no match, to_ver is None and the vulnerability is
          # logged as a warning but skipped from automated remediation — a human
          # will need to resolve it manually.
          #
          # If all candidates are <= the installed version the package is already
          # on a newer build than the advisory covers (e.g. a vendor-patched fork)
          # and is also skipped with a warning.
          # ---------------------------------------------------------------------
          candidates_match = re.search(
              r'[Uu]pgrade to (?:versions?\s+)?(.+?)(?:\s+or above)?\.?\s*$',
              solution
          )

          to_ver = None
          if candidates_match:
              raw_candidates = candidates_match.group(1)

              # Split on any combination of whitespace and commas, then keep
              # only tokens that start with a digit (version numbers). This
              # discards stray words like "or" that survive the outer regex.
              candidates = [
                  c.strip().rstrip('.,')
                  for c in re.split(r'[\s,]+', raw_candidates)
                  if re.match(r'\d', c.strip())
              ]

              if candidates:
                  try:
                      from_key = version_key(from_ver)

                      # Discard candidates that would be a downgrade.
                      upgradeable = [
                          c for c in candidates
                          if version_key(c) > from_key
                      ]

                      if upgradeable:
                          to_ver = min(upgradeable, key=version_key)
                          if len(candidates) > 1:
                              # Log the selection reasoning when multiple
                              # candidates were present so the job output
                              # shows exactly why this version was chosen.
                              print(
                                  f"  [VERSION SELECT] {pkg_name} @ {from_ver} — "
                                  f"candidates: {candidates} — selected: {to_ver}"
                              )
                      else:
                          # All listed fix versions are <= installed. This can
                          # happen with vendor-patched forks that have a higher
                          # version than the upstream advisory targets.
                          print(
                              f"  [VERSION WARN] {pkg_name} @ {from_ver} — "
                              f"all candidates {candidates} are <= installed version, skipping"
                          )
                  except (ValueError, TypeError) as e:
                      # version_key() raises ValueError if a token produces no
                      # digit segments at all (e.g. a codename like "Hoxton").
                      print(
                          f"  [VERSION WARN] {pkg_name} — could not compare versions "
                          f"({from_ver} vs {candidates}): {e}"
                      )

          # Only build.gradle vulnerabilities need a patch script. yarn.lock
          # vulnerabilities are handled by yarn upgrade which resolves versions
          # automatically without needing explicit version targeting.
          if loc_file in ('build.gradle', 'gradle.lockfile') and from_ver and to_ver:
              gradle_remediations.append((pkg_name, from_ver, to_ver, loc_file))
              print(f"  [GRADLE FIX] {pkg_name}: {from_ver} → {to_ver} in {loc_file}")
          elif loc_file in ('build.gradle', 'gradle.lockfile') and not to_ver:
              print(
                  f"  [GRADLE WARN] Could not parse target version "
                  f"from solution: '{solution}'"
              )

      # Print the full inventory to the job log for audit visibility.
      print(f"\nAffected lockfiles: {affected_files or 'none'}")
      print("Vulnerability summary:")
      for line in vuln_summary:
          print(line)

      # -------------------------------------------------------------------------
      # FIX_* flag derivation
      #
      # Each flag is set by checking whether that lockfile's path appears in the
      # affected_files set. The path strings must exactly match what GitLab's
      # scanner writes into the location.file field of the report — if a project
      # stores its lockfile at a different relative path, add a new flag here and
      # a corresponding if-block in the relevant fix job.
      #
      # any_found is the master gate: if no qualifying CVEs were found in any
      # known lockfile, the pipeline prints a clean bill of health and all
      # downstream fix jobs exit early when they check their own FIX_* flag.
      # -------------------------------------------------------------------------
      fix_frontend_package = 'yarn.lock'          in affected_files
      fix_frontend         = 'frontend/yarn.lock' in affected_files
      fix_journey          = 'journey/yarn.lock'  in affected_files
      fix_backend          = 'build.gradle'       in affected_files or 'gradle.lockfile' in affected_files
      any_found            = fix_frontend_package or fix_frontend or fix_journey or fix_backend

      # -------------------------------------------------------------------------
      # Write vuln.env (dotenv artifact)
      #
      # GitLab's dotenv artifact type makes these key=value pairs available as
      # environment variables in any downstream job that declares:
      #   needs:
      #     - job: check:vulnerabilities
      #       artifacts: true
      #
      # IMPORTANT: dotenv variables are only available at job runtime. They
      # cannot be referenced in rules: conditions, which are evaluated before
      # any jobs run. All gating on these flags must happen inside script: blocks.
      # -------------------------------------------------------------------------
      with open('vuln.env', 'w') as env:
          env.write(f"VULNERABILITIES_FOUND={'true' if any_found            else 'false'}\n")
          env.write(f"FIX_FRONTEND_PACKAGE={'true'  if fix_frontend_package  else 'false'}\n")
          env.write(f"FIX_FRONTEND={'true'          if fix_frontend          else 'false'}\n")
          env.write(f"FIX_JOURNEY={'true'           if fix_journey           else 'false'}\n")
          env.write(f"FIX_BACKEND={'true'           if fix_backend           else 'false'}\n")

      # -------------------------------------------------------------------------
      # Write gradle_remediations.sh (path artifact)
      #
      # Rather than passing multiple package/version pairs through environment
      # variables (which would require complex encoding), this script generates
      # a self-contained shell script as an artifact. fix-backend-python picks
      # it up and executes it directly.
      #
      # The shell script contains one embedded Python heredoc per vulnerability.
      # Python is used for the inner patch (rather than sed) because build.gradle
      # dependency version declarations span multiple lines:
      #
      #   implementation('io.netty:netty-codec') {
      #     version {
      #       require "4.1.125.Final"
      #     }
      #   }
      #
      # sed operates line-by-line and cannot reliably match a version string that
      # only appears inside a block associated with a specific package name above
      # it. Python with re.DOTALL can match across the entire block, scoping the
      # substitution to the correct dependency and leaving all others untouched.
      #
      # set -e at the top of the shell script causes it to abort immediately if
      # any individual patch command fails, preventing a partial remediation from
      # being committed silently.
      # -------------------------------------------------------------------------
      with open('gradle_remediations.sh', 'w') as sh:
          sh.write("#!/bin/sh\nset -e\n\n")
          if gradle_remediations:
              for pkg_name, from_ver, to_ver, loc_file in gradle_remediations:
                  # The scan report uses / as the group/artifact separator
                  # (e.g. "io.netty/netty-codec") but build.gradle uses :
                  # (e.g. "io.netty:netty-codec"). Split on / and take the last
                  # segment to get just the artifact ID used in the regex below.
                  artifact = pkg_name.split('/')[-1]
                  sh.write(f"echo \"  Patching {pkg_name}: {from_ver} -> {to_ver} in {loc_file}\"\n")

                  # re.escape ensures artifact names containing regex metacharacters
                  # (dots, hyphens, etc.) are treated as literals in the pattern.
                  escaped_artifact = re.escape(artifact)

                  # textwrap.dedent strips the leading indentation from the
                  # heredoc so it is written flush-left in the shell script,
                  # which is required for the PYEOF delimiter to be recognized.
                  #
                  # The regex pattern inside the heredoc matches a full
                  # multi-line Gradle dependency block:
                  #   Group 1: everything from implementation(...) up to the
                  #            opening quote of the version string
                  #   Group 2: the current version string (what gets replaced)
                  #   Group 3: the closing quote character
                  # The substitution keeps groups 1 and 3 and replaces group 2
                  # with the target version, leaving the surrounding syntax intact.
                  sh.write(textwrap.dedent(f"""\
                  python3 << 'PYEOF'
                  from pathlib import Path
                  import re
                  path = Path("{loc_file}")
                  text = path.read_text()
                  pattern = re.compile(
                    r"(implementation\\(['\\"](?:[^:'\\"]+:)?{escaped_artifact}['\\"]\\)\\s*\\{{[^}}]*?require\\s+['\\"])"
                    r"([^'\\"]+)"
                    r"(['\\"])",
                    re.DOTALL
                  )
                  updated = pattern.sub(
                    rf"\\g<1>{to_ver}\\3",
                    text
                  )
                  path.write_text(updated)
                  print("Updated {artifact} -> {to_ver}")
                  PYEOF
                  """))
                  sh.write(f"echo \"  Done.\"\n\n")
          else:
              sh.write("echo 'No gradle remediations to apply.'\n")

      print(f"\nWrote {len(gradle_remediations)} gradle remediation(s) to gradle_remediations.sh")

      if not any_found:
          print("\nNo vulnerabilities found. Pipeline will stop after this job.")
      else:
          print(
              f"\nFlags — FIX_FRONTEND_PACKAGE={fix_frontend_package}, "
              f"FIX_FRONTEND={fix_frontend}, FIX_JOURNEY={fix_journey}, "
              f"FIX_BACKEND={fix_backend}"
          )
      EOF
  artifacts:
    reports:
      # dotenv artifacts are available as env vars in all downstream jobs
      # that declare needs: with artifacts: true on this job.
      dotenv: vuln.env
    paths:
      # The remediation script is passed as a regular path artifact so
      # fix-backend-python can execute it directly.
      - gradle_remediations.sh
    expire_in: 1 day

# =============================================================================
# STAGE: fix-frontend
# =============================================================================

fix-frontend:
  stage: fix-frontend
  # .node-dep's before_script (CA-cert setup) and .configure-commit-signing's
  # before_script are combined explicitly below — see the comment on
  # .configure-commit-signing for why extends: can't do this on its own.
  extends:
    - .dep_pipe_rules
    - .node-dep
  before_script:
    - !reference [.node-dep, before_script]
    - !reference [.configure-commit-signing, before_script]
  needs:
    - job: check:vulnerabilities
      artifacts: true
  script:
    - |
      if [ "$FIX_FRONTEND_PACKAGE" != "true" ] &&
        [ "$FIX_FRONTEND" != "true" ] &&
        [ "$FIX_JOURNEY" != "true" ]; then
        echo "No frontend vulnerabilities found. Skipping."
        exit 0
      fi

    # Git identity and commit signing are configured in before_script.
    # Only the token-based remote auth is specific to this job.
    - git remote set-url origin "https://oauth2:$DEPENDENCY_GOBLIN_TOKEN@$CI_SERVER_HOST/$CI_PROJECT_PATH.git"

    # Create or reuse the remediation branch.
    - |
      FIX_BRANCH="auto-fix-vuln-remediation-$CI_PIPELINE_ID"

      git fetch --quiet origin

      if git ls-remote --exit-code --heads origin "$FIX_BRANCH" >/dev/null 2>&1; then
        git checkout -B "$FIX_BRANCH" "origin/$FIX_BRANCH"
      else
        git checkout -b "$FIX_BRANCH" "origin/$CI_DEFAULT_BRANCH"
      fi

    # frontend/yarn.lock
    - |
      if [ "$FIX_FRONTEND" = "true" ]; then
        echo "=== Upgrading frontend/yarn.lock ==="

        (
          cd frontend
          yarn install --ignore-scripts
          yarn upgrade --ignore-scripts
        )

        git add frontend/yarn.lock frontend/package.json

        if ! git diff --cached --quiet; then
          git commit -S -m "fix(frontend): auto-upgrade yarn dependencies"
          git verify-commit HEAD || { echo "ERROR: fix(frontend) commit is not validly signed"; exit 1; }
        fi
      else
        echo "--- Skipping frontend/yarn.lock (no CVEs) ---"
      fi

    # Root yarn.lock
    - |
      if [ "$FIX_FRONTEND_PACKAGE" = "true" ]; then
        echo "=== Upgrading root yarn.lock ==="

        yarn install --ignore-scripts
        yarn upgrade --ignore-scripts

        git add yarn.lock package.json

        if ! git diff --cached --quiet; then
          git commit -S -m "fix(frontend-package): auto-upgrade yarn dependencies"
          git verify-commit HEAD || { echo "ERROR: fix(frontend-package) commit is not validly signed"; exit 1; }
        fi
      else
        echo "--- Skipping root yarn.lock (no CVEs) ---"
      fi

    # journey/yarn.lock
    - |
      if [ "$FIX_JOURNEY" = "true" ]; then
        echo "=== Upgrading journey/yarn.lock ==="

        (
          cd journey
          yarn install --ignore-scripts
          yarn upgrade --ignore-scripts
        )

        git add journey/yarn.lock journey/package.json

        if ! git diff --cached --quiet; then
          git commit -S -m "fix(journey): auto-upgrade yarn dependencies"
          git verify-commit HEAD || { echo "ERROR: fix(journey) commit is not validly signed"; exit 1; }
        fi
      else
        echo "--- Skipping journey/yarn.lock (no CVEs) ---"
      fi

    # Push the completed remediation branch.
    - |
      FIX_BRANCH="auto-fix-vuln-remediation-$CI_PIPELINE_ID"
      git push origin "$FIX_BRANCH"
      echo "FIX_BRANCH=$FIX_BRANCH" > fix_branch.env
  artifacts:
    reports:
      dotenv: fix_branch.env
    expire_in: 1 day

# =============================================================================
# STAGE: fix-backend
#
# Split into two sequential jobs because they need different images:
#   fix-backend-python  lightweight pipeline image — patches build.gradle
#   fix-backend-gradle  JDK image — regenerates gradle.lockfile using gradlew
# =============================================================================

fix-backend-python:
  stage: fix-backend
  extends: .dep_pipe_rules
  before_script:
    - !reference [.configure-commit-signing, before_script]
  tags:
    - px-app-build
  image: 421584343086.dkr.ecr.us-gov-west-1.amazonaws.com/1-platform-images/chainguard/cdso-pipeline-image-two:latest
  needs:
    - job: fix-frontend
      artifacts: true
    - job: check:vulnerabilities
      artifacts: true
  script:
    - |
      if [ "$FIX_BACKEND" != "true" ]; then
        echo "No backend vulnerabilities found. Skipping."
        exit 0
      fi

      echo "=== Applying gradle remediations ==="
      # Print the generated script before executing it for full visibility
      # in the job log — makes it easy to see exactly what was patched.
      cat gradle_remediations.sh
      chmod +x gradle_remediations.sh
      ./gradle_remediations.sh

      echo "=== Committing build.gradle changes ==="
      git config --global --add safe.directory /builds/$CI_PROJECT_PATH
      git remote set-url origin "https://oauth2:$DEPENDENCY_GOBLIN_TOKEN@$CI_SERVER_HOST/$CI_PROJECT_PATH.git"

      # If fix-frontend already created this branch, check it out instead
      # of trying to create it again.
    - |
      FIX_BRANCH="auto-fix-vuln-remediation-$CI_PIPELINE_ID"
      git fetch origin

      if git ls-remote --exit-code --heads origin "$FIX_BRANCH" > /dev/null; then
        git checkout -B "$FIX_BRANCH" "origin/$FIX_BRANCH"
      else
        git checkout -b "$FIX_BRANCH" "origin/$CI_DEFAULT_BRANCH"
      fi

      git add build.gradle
      if ! git diff --cached --quiet; then
        git commit -S -m "fix(backend): auto-patch dependency versions for CVE remediation"
        git verify-commit HEAD || { echo "ERROR: fix(backend) commit is not validly signed"; exit 1; }
      fi
      git push origin "$FIX_BRANCH"
      echo "FIX_BRANCH=auto-fix-vuln-remediation-$CI_PIPELINE_ID" >> fix_branch.env
  artifacts:
    reports:
      dotenv: fix_branch.env
    expire_in: 1 day

fix-backend-gradle:
  stage: fix-backend
  # .gradle-dep's before_script (JVM truststore + gradle wrapper mirror) and
  # .configure-commit-signing's before_script are combined explicitly below —
  # see the comment on .configure-commit-signing for why extends: can't do
  # this on its own.
  extends:
    - .dep_pipe_rules
    - .gradle-dep
  before_script:
    - !reference [.gradle-dep, before_script]
    - !reference [.configure-commit-signing, before_script]
  needs:
    - job: fix-backend-python
    - job: check:vulnerabilities
      artifacts: true
  script:
    - |
      git config --global --add safe.directory /builds/$CI_PROJECT_PATH
      git remote set-url origin "https://oauth2:$DEPENDENCY_GOBLIN_TOKEN@$CI_SERVER_HOST/$CI_PROJECT_PATH.git"
    - |
      FIX_BRANCH="auto-fix-vuln-remediation-$CI_PIPELINE_ID"
      git fetch origin

      if git ls-remote --exit-code --heads origin "$FIX_BRANCH" > /dev/null; then
        git checkout -B "$FIX_BRANCH" "origin/$FIX_BRANCH"
      else
        git checkout -b "$FIX_BRANCH" "origin/$CI_DEFAULT_BRANCH"
      fi

      echo "=== Regenerating gradle.lockfile ==="
      # Delete the existing lockfile so --write-locks produces a clean one
      # against the patched build.gradle rather than merging with stale entries.
      touch gradle.lockfile
      rm gradle.lockfile
      ./gradlew dependencies --write-locks

      git add gradle.lockfile
      if ! git diff --cached --quiet; then
        git commit -S -m "fix(backend): regenerate gradle.lockfile after CVE remediation"
        git verify-commit HEAD || { echo "ERROR: gradle.lockfile commit is not validly signed"; exit 1; }
      fi
      git push origin "$FIX_BRANCH"
      echo "FIX_BRANCH=auto-fix-vuln-remediation-$CI_PIPELINE_ID" >> fix_branch.env
  artifacts:
    reports:
      dotenv: fix_branch.env
    expire_in: 1 day

# =============================================================================
# STAGE: merge-request
# =============================================================================

create:merge-request:
  stage: merge-request
  extends: .dep_pipe_rules
  tags:
    - px-app-build
  image: 421584343086.dkr.ecr.us-gov-west-1.amazonaws.com/1-platform-images/chainguard/cdso-pipeline-image-two:latest
  # Needs all three fix jobs so FIX_BRANCH and all FIX_* flags are available.
  # fix-frontend and fix-backend-python both write FIX_BRANCH to fix_branch.env;
  # whichever ran last wins, but the value is identical so order doesn't matter.
  needs:
    - job: fix-frontend
    - job: fix-backend-python
    - job: fix-backend-gradle
    - job: check:vulnerabilities
      artifacts: true
  script:
    - |
      echo "=== Cleaning up stale auto-fix branches ==="

      git config --global --add safe.directory /builds/$CI_PROJECT_PATH
      git config --global user.email "$DEPENDENCY_GOBLIN_EMAIL"
      git config --global user.name "$DEPENDENCY_GOBLIN_NAME"
      git remote set-url origin "https://oauth2:$DEPENDENCY_GOBLIN_TOKEN@$CI_SERVER_HOST/$CI_PROJECT_PATH.git"
      git fetch origin

      # Fetch all remote branches matching the prefix using git ls-remote,
      # strip the refs/heads/ prefix, then exclude the current pipeline's branch.
      STALE_BRANCHES=$(git ls-remote --heads origin 'auto-fix-vuln-remediation-*' \
        | awk '{print $2}' \
        | sed 's|refs/heads/||' \
        | grep -v "auto-fix-vuln-remediation-$CI_PIPELINE_ID" \
        || true)

      if [ -z "$STALE_BRANCHES" ]; then
        echo "No stale branches found."
      else
        echo "Stale branches to delete:"
        echo "$STALE_BRANCHES"
        echo "$STALE_BRANCHES" | while IFS= read -r branch; do
          echo "  Deleting: $branch"
          git push origin --delete "$branch"
          echo "  Deleted successfully."
        done
      fi

      echo "========================================"
      echo "  CREATE MERGE REQUEST"
      echo "========================================"
      echo "  FIX_BRANCH:           $FIX_BRANCH"
      echo "  TARGET:               $CI_DEFAULT_BRANCH"
      echo "  PROJECT ID:           $CI_PROJECT_ID"
      echo "  API URL:              $CI_API_V4_URL"
      echo "  FIX_FRONTEND_PACKAGE: $FIX_FRONTEND_PACKAGE"
      echo "  FIX_FRONTEND:         $FIX_FRONTEND"
      echo "  FIX_JOURNEY:          $FIX_JOURNEY"
      echo "  FIX_BACKEND:          $FIX_BACKEND"
      echo "========================================"

      # Diff check
      #
      # Check whether the fix branch exists on the remote at all — if no
      # fix job committed anything the branch was never pushed. Then diff
      # the fix branch against main. If there are no changed files there
      # is nothing to merge and no MR should be opened.

      if ! git ls-remote --exit-code --heads origin "$FIX_BRANCH" > /dev/null 2>&1; then
        echo "Fix branch $FIX_BRANCH does not exist on remote — no commits were made, skipping MR creation."
        exit 0
      fi

      CHANGED_FILES=$(git diff "origin/$CI_DEFAULT_BRANCH" "origin/$FIX_BRANCH" --name-only)

      if [ -z "$CHANGED_FILES" ]; then
        echo "No differences between $FIX_BRANCH and $CI_DEFAULT_BRANCH — skipping MR creation."
        exit 0
      fi

      # Build the MR description dynamically based on which package managers
      # were actually affected.
      FIXED_ITEMS=""
      [ "$FIX_FRONTEND_PACKAGE" = "true" ] && FIXED_ITEMS="${FIXED_ITEMS}- \`yarn.lock\` — upgraded via \`yarn upgrade\`\n"
      [ "$FIX_FRONTEND" = "true" ]         && FIXED_ITEMS="${FIXED_ITEMS}- \`frontend/yarn.lock\` — upgraded via \`yarn upgrade\`\n"
      [ "$FIX_JOURNEY"  = "true" ]         && FIXED_ITEMS="${FIXED_ITEMS}- \`journey/yarn.lock\` — upgraded via \`yarn upgrade\`\n"
      [ "$FIX_BACKEND"  = "true" ]         && FIXED_ITEMS="${FIXED_ITEMS}- \`build.gradle\` + \`gradle.lockfile\` — patched and regenerated\n"

      echo "Fixed items:"
      echo -e "$FIXED_ITEMS"

      MR_TITLE="fix: auto-remediate dependency vulnerabilities (pipeline #${CI_PIPELINE_ID})"

      MR_DESCRIPTION=$(cat <<EOF
      ## Automated Vulnerability Remediation

      This MR was automatically created by pipeline #${CI_PIPELINE_ID} after the daily dependency scan detected CVEs.

      ### Changes
      ${FIXED_ITEMS}

      ### Validation
      - Lint passed (inline with upgrade)
      - Build passed
      - Tests passed

      Please review the dependency diff before merging.
      EOF
      )

      echo "Sending MR creation request..."
      RESPONSE=$(curl --show-error \
        --request POST \
        --header "PRIVATE-TOKEN: ${DEPENDENCY_GOBLIN_TOKEN}" \
        --data "source_branch=${FIX_BRANCH}" \
        --data "target_branch=${CI_DEFAULT_BRANCH}" \
        --data "title=${MR_TITLE}" \
        --data "description=${MR_DESCRIPTION}" \
        --data "assignee_id=${ASSIGNEE_USER_ID}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests"
      )

      echo "Raw API response:"
      echo "$RESPONSE"

      # Parse the API response for errors. The GitLab API returns HTTP 200 even
      # for logical errors (e.g. duplicate MR, invalid branch), so we check the
      # response body rather than the HTTP status code.
      ERROR=$(echo "$RESPONSE" | python3 -c "
      import json,sys
      r = json.load(sys.stdin)
      errs = r.get('message', r.get('error', ''))
      print(errs) if errs else print('none')
      ")
      if [ "$ERROR" != "none" ]; then
        echo "ERROR: GitLab API returned an error: $ERROR"
        exit 1
      fi

      MR_URL=$(echo "$RESPONSE" | python3 -c "import json,sys; print(json.load(sys.stdin).get('web_url', 'URL not found'))")
      echo "========================================"
      echo "  Merge request created: $MR_URL"
      echo "========================================"