# =============================================================================
# .gitlab-ci.yml — Vulnerability Auto-Remediation Template
#
# Intended usage — in each project's .gitlab-ci.yml:
#
#   include:
#     - project: 'your-group/centralized-pipelines'
#       file: '/standard-pipeline.yml'    # your existing test/build/publish jobs
#       ref: main
#     - project: 'your-group/vuln-remediation'
#       file: '/.gitlab-ci.yml'           # this file
#       ref: main
#
# Flow:
#   check:vulnerabilities  →  parse scan report, set FIX_* flags
#   auto:fix               →  upgrade affected deps + lint inline, push branch
#   trigger:validation     →  fire standard pipeline on fix branch (runs your
#                             existing test/build jobs — no duplication)
#   create:merge-request   →  open MR only if triggered pipeline passed
#
# REQUIRED CI/CD VARIABLES (Settings → CI/CD → Variables in each project)
#   GL_PAT             Personal Access Token (api + write_repository scopes) [masked]
#   ASSIGNEE_USER_ID   GitLab numeric user ID to assign the MR to
# =============================================================================
variables:
  DEPENDENCY_SAVIOR_TOKEN: "$DEPENDENCY_SAVIOR_TOKEN"

stages:
  - check
  - auto-fix
  # - trigger-validation
  # - merge-request

# =============================================================================
# CHECK — parse scan report, identify which lockfiles are affected
#
# Produces dotenv flags:
#   VULNERABILITIES_FOUND   — true if any CVEs exist
#   FIX_FRONTEND            — true if frontend/yarn.lock is affected
#   FIX_JOURNEY             — true if journey/yarn.lock is affected
#   FIX_BACKEND             — true if gradle.lockfile is affected
# =============================================================================

check:vulnerabilities:
  stage: check
  tags:
    - px-app-build
  image: 421584343086.dkr.ecr.us-gov-west-1.amazonaws.com/1-platform-images/chainguard/pipeline-image:latest
  needs:
    - project: "$CI_PROJECT_PATH"
      job: dependency-scanning
      ref: "$CI_COMMIT_REF_NAME"
      artifacts: true

  script:
    - |
      python3 << 'EOF'
      import json

      with open('gl-dependency-scanning-report.json') as f:
          report = json.load(f)

      target_severities = {'Critical', 'High', 'Medium', 'Low'}

      affected_files = set()
      vuln_summary = []

      for v in report.get('vulnerabilities', []):
          if v.get('severity') not in target_severities:
              continue
          loc_file = v.get('location', {}).get('file', '')
          affected_files.add(loc_file)
          pkg = v.get('location', {}).get('dependency', {}).get('package', {}).get('name', 'unknown')
          vuln_summary.append(f"  [{v.get('severity')}] {v.get('name')} — {loc_file} (package: {pkg})")

      print(f"\nAffected lockfiles: {affected_files or 'none'}")
      print("Vulnerability summary:")
      for line in vuln_summary:
          print(line)

      fix_frontend_package = 'yarn.lock' in affected_files
      fix_frontend = 'frontend/yarn.lock' in affected_files
      fix_journey  = 'journey/yarn.lock'  in affected_files
      fix_backend  = 'gradle.lockfile'    in affected_files
      any_found    = fix_frontend_package or fix_frontend or fix_journey or fix_backend

      with open('vuln.env', 'w') as env:
          env.write(f"VULNERABILITIES_FOUND={'true' if any_found    else 'false'}\n")
          env.write(f"FIX_FRONTEND_PACKAGE={'true'          if fix_frontend_package  else 'false'}\n")
          env.write(f"FIX_FRONTEND={'true'          if fix_frontend  else 'false'}\n")
          env.write(f"FIX_JOURNEY={'true'           if fix_journey   else 'false'}\n")
          env.write(f"FIX_BACKEND={'true'           if fix_backend   else 'false'}\n")

      if not any_found:
          print("\nNo vulnerabilities found. Pipeline will stop after this job.")
      else:
          print(f"\nFlags — FIX_FRONTEND_PACKAGE={fix_frontend_package}, FIX_FRONTEND={fix_frontend}, FIX_JOURNEY={fix_journey}, FIX_BACKEND={fix_backend}")
      EOF
  artifacts:
    reports:
      dotenv: vuln.env
    expire_in: 1 day

# =============================================================================
# AUTO-FIX — create branch, upgrade affected deps, lint inline, push
#
# Single job to avoid parallel git commit conflicts.
# Linting is run immediately after each upgrade so failures are caught
# before the branch is pushed.
# =============================================================================

.node:
  image: 421584343086.dkr.ecr.us-gov-west-1.amazonaws.com/1-platform-images/chainguard/node-fips:20.20-dev
  tags:
    - px-app-build
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
    policy: pull
  before_script:
    - |
      export COMBINED_CA="$CI_PROJECT_DIR/combined-ca.crt"
      cat /etc/ssl/certs/ca-certificates.crt /etc/ssl/custom/dod-ca-bundle.pem > "$COMBINED_CA"
      export NODE_EXTRA_CA_CERTS="$COMBINED_CA"
      npm config set cafile "$COMBINED_CA"
      yarn config set cafile "$COMBINED_CA"

