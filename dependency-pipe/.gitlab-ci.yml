# # =============================================================================
# # MERGE REQUEST — only reached if trigger:validation passed
# # =============================================================================

create:merge-request:
  stage: merge-request
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $RUN_DEP_PIPE == "true"'  # manual trigger override for testing and devs
    - when: never
  tags:
    - px-app-build
  image: 421584343086.dkr.ecr.us-gov-west-1.amazonaws.com/1-platform-images/chainguard/pipeline-image:latest
  needs:
    # - job: trigger:validation
    - job: fix-frontend
    - job: fix-backend-python
    - job: fix-backend-gradle
    - job: check:vulnerabilities
      artifacts: true
  script:
    - |

      echo "========================================"
      echo "  CREATE MERGE REQUEST"
      echo "========================================"
      echo "  FIX_BRANCH:   $FIX_BRANCH"
      echo "  TARGET:       $CI_DEFAULT_BRANCH"
      echo "  PROJECT ID:   $CI_PROJECT_ID"
      echo "  API URL:      $CI_API_V4_URL"
      echo "  FIX_FRONTEND_PACKAGE: $FIX_FRONTEND_PACKAGE"
      echo "  FIX_FRONTEND:         $FIX_FRONTEND"
      echo "  FIX_JOURNEY:          $FIX_JOURNEY"
      echo "  FIX_BACKEND:          $FIX_BACKEND"
      echo "  url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests""
      echo "========================================"

      if [ -z "$FIX_BRANCH" ]; then
        echo "FIX_BRANCH is empty — no branch ready for MR"
        exit 1
      fi

      FIXED_ITEMS=""
      [ "$FIX_FRONTEND_PACKAGE" = "true" ] && FIXED_ITEMS="${FIXED_ITEMS}- \`yarn.lock\` — upgraded via \`yarn upgrade\`\n"
      [ "$FIX_FRONTEND" = "true" ]         && FIXED_ITEMS="${FIXED_ITEMS}- \`frontend/yarn.lock\` — upgraded via \`yarn upgrade\`\n"
      [ "$FIX_JOURNEY"  = "true" ]         && FIXED_ITEMS="${FIXED_ITEMS}- \`journey/yarn.lock\` — upgraded via \`yarn upgrade\`\n"
      [ "$FIX_BACKEND"  = "true" ]         && FIXED_ITEMS="${FIXED_ITEMS}- \`gradle.lockfile\` — refreshed via \`./gradlew --refresh-dependencies\`\n"

      echo "Fixed items summary:"
      echo -e "$FIXED_ITEMS"

      echo "Sending MR creation request..."
      RESPONSE=$(curl --show-error \
        --request POST \
        --header "PRIVATE-TOKEN: ${DEPENDENCY_SAVIOR_TOKEN}" \
        --data "source_branch: ${FIX_BRANCH}" \
        --data "target_branch: ${CI_DEFAULT_BRANCH}" \
        --data "title: "fix: auto-remediate dependency vulnerabilities (pipeline #${CI_PIPELINE_ID})" \
        --data "description: "## Automated Vulnerability Remediation\n\nThis MR was automatically created by pipeline [#${CI_PIPELINE_ID}](${CI_PIPELINE_URL}) after the daily dependency scan detected CVEs.\n\n### Changes\n${FIXED_ITEMS}\n### Validation\n- Lint passed (inline with upgrade)\n- Build passed\n- Tests passed\n\nPlease review the dependency diff before merging." \
        --data "assignee_id: ${ASSIGNEE_USER_ID}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests" \
        )

      echo "Raw API response:"
      echo "$RESPONSE"

      # Check for API-level errors
      ERROR=$(echo "$RESPONSE" | python3 -c "
      import json,sys
      r = json.load(sys.stdin)
      errs = r.get('message', r.get('error', ''))
      print(errs) if errs else print('none')
      ")
      if [ "$ERROR" != "none" ]; then
        echo "ERROR: GitLab API returned an error: $ERROR"
        exit 1
      fi

      MR_URL=$(echo "$RESPONSE" | python3 -c "import json,sys; print(json.load(sys.stdin).get('web_url', 'URL not found'))")
      echo "========================================"
      echo "  Merge request created: $MR_URL"
      echo "========================================"

