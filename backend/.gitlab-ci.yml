test:
  extends: .gradle
  stage: test
  script:
    - ./gradlew test

build:
  extends: .gradle
  stage: build
  script:
    - ./gradlew assemble
  artifacts:
    paths:
      - "./build"

publish:
  extends: .gradle
  stage: publish
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule" && $CI_COMMIT_TAG != null'
  script:
    - git config --global --add safe.directory /builds/army-software-factory/product-office/sdu-3/3-3/tesseract/packages/${CI_PROJECT_NAME}
    - |
      if [ -z "$CI_COMMIT_TAG" ]; then
        echo "No commit tag provided. Skipping publish."
        exit 0
      fi
      ./gradlew publish