# stages:
#   - test
#   - build
#   - publish

.node:
  image: 421584343086.dkr.ecr.us-gov-west-1.amazonaws.com/1-platform-images/chainguard/node-fips:20.20-dev
  tags:
    - px-app-build
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
    policy: pull
  before_script:
    - |
      export COMBINED_CA="$CI_PROJECT_DIR/combined-ca.crt"
      cat /etc/ssl/certs/ca-certificates.crt /etc/ssl/custom/dod-ca-bundle.pem > "$COMBINED_CA"
      export NODE_EXTRA_CA_CERTS="$COMBINED_CA"
      npm config set cafile "$COMBINED_CA"
      yarn config set cafile "$COMBINED_CA"
      #
test:
  extends: .node
  stage: test
  script:
    - |
      yarn install
      # yarn lint
      yarn test

build:
  extends: .node
  stage: build
  script:
    - |
      yarn install
      yarn build
  artifacts:
    paths:
      - dist/

publish:
  extends: .node
  stage: publish
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule" && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG != null)'
  script:
    - git config --global --add safe.directory /builds/army-software-factory/environments/inner-source/tesseract/tesseract-packages/frontend/${CI_PROJECT_NAME}
    - |
      if [ -z "$CI_COMMIT_TAG" ]; then
        echo "No commit tag provided. Skipping publish."
        exit 0
      else
        npm config set registry "https://gitlab.vulcan.mil/api/v4/projects/481/packages/npm/"
        npm config set "//gitlab.vulcan.mil/api/v4/projects/481/packages/npm/:_authToken=${TESSERACT_PUBLISH}"
        ls -lah  
        cd dist
        npm publish
      fi

publish-nexus:
  extends: .node
  stage: publish
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule" && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG != null)'
  script:
    - git config --global --add safe.directory /builds/army-software-factory/environments/inner-source/tesseract/tesseract-packages/frontend/${CI_PROJECT_NAME}
    - |
      if [ -z "$CI_COMMIT_TAG" ]; then
        echo "No commit tag provided. Skipping publish."
        exit 0
      else
        npm config set registry "https://nexus.swf.army.mil/repository/tesseract-frontend-packages" --verbose
        # even if you change to using yarn to publish, use npm config set for the next line. Doesnt make sense but needs npm not yarn or it wont work.
        npm config set "//nexus.swf.army.mil/repository/tesseract-frontend-packages/:_auth=${NEXUS_TESSERACT_PUBLISH}" 
        ls -lah  
        cd dist
        npm publish --registry https://nexus.swf.army.mil/repository/tesseract-frontend-packages/  
      fi